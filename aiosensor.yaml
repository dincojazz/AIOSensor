      still_energy:
        name: "mmWave g8 still energy"
  - platform: adc
    pin: "${batt_volt_pin}" # Voltage Divider Output
    id: raw_adc_voltage
    name: "Battery Voltage Raw"
    internal: true
    update_interval: never #60s - Takes a reading every minute
    attenuation: 12db # Range up to ~3.3V
    accuracy_decimals: 3
    filters:
      - multiply: ${voltage_multiplier}
  - platform: template
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 2
    update_interval: ${battery_update_interval}
    on_value_range:
      - below: 3.3
        then:
          - homeassistant.service:
              service: notify.notify
              data:
                title: "Critical batetry: ${friendly_name}"
                message: "Voltage is under 3.3V!"
                priority: "high"
    lambda: "return id(raw_adc_voltage).state;"
    on_value:
      then:
        - if:
            condition:
              binary_sensor.is_on: link_ha_connected
            then:
              - switch.turn_on: batt_divider_switch
              - delay: 500ms
              - component.update: raw_adc_voltage
              - switch.turn_off: batt_divider_switch
            else:
              - logger.log: "HA disconnected - Missing measuring."
  - platform: copy
    source_id: battery_voltage
    name: "Battery Charge Percent"
    id: battery_percent
    unit_of_measurement: "%"
    device_class: "battery"
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 4.2 -> 100
          - 4.0 -> 80
          - 3.8 -> 60
          - 3.7 -> 40
          - 3.5 -> 10
          - 3.3 -> 0
      - clamp:
          min_value: 0
          max_value: 100
  - platform: homeassistant
    name: "BME680 Sensor Lifespan"
    id: bme680_lifespan
    entity_id: "sensor.aiosensor_hall_bme680_sensor_lifespan"
    unit_of_measurement: "%"
    icon: "mdi:heart-pulse"
    accuracy_decimals: 1
    entity_category: "diagnostic"

