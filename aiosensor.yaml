script:
  - id: AQI_LED_control
    mode: single
    then:
      - if:
          condition:
            - lambda: return id(iaqstatic).state < 50;
          then:
            - light.turn_on:
                id: ws2812_7led
                effect: 5 LED Dial
            - light.turn_off:
                id: ws2812_7led7
            - light.turn_on:
                id: ws2812_7led7
                effect: Slow Pulse 40%
                brightness: !lambda |-
                  return ((id(illuminance_sensor).state / 100.0) + 0.1);
                red:   0
                green: 1
                blue:  0
      - if:
          condition:
            - lambda: return id(iaqstatic).state >= 50 && id(iaqstatic).state < 100;
          then:
            - light.turn_on:
                id: ws2812_7led
                effect: 5 LED Dial
            - light.turn_off:
                id: ws2812_7led7
            - light.turn_on:
                id: ws2812_7led7
                effect: Slow Pulse 40%
                brightness: !lambda |-
                  return ((id(illuminance_sensor).state / 100.0) + 0.1);
                red: 1
                green: 1
                blue: 0
      - if:
          condition:
            - lambda: return id(iaqstatic).state >= 100 && id(iaqstatic).state < 150;
          then:
            - light.turn_on:
                id: ws2812_7led
                effect: 5 LED Dial
            - light.turn_off:
                id: ws2812_7led7
            - light.turn_on:
                id: ws2812_7led7
                effect: Slow Pulse 40%
                brightness: !lambda |-
                  return ((id(illuminance_sensor).state / 100.0) + 0.1);
                red: 1
                green: 0.65
                blue: 0
      - if:
          condition:
            - lambda: return id(iaqstatic).state >= 150 && id(iaqstatic).state < 200;
          then:
            - light.turn_on:
                id: ws2812_7led
                effect: 5 LED Dial
            - light.turn_off:
                id: ws2812_7led7
            - light.turn_on:
                id: ws2812_7led7
                effect: Slow Pulse 40%
                brightness: !lambda |-
                  return ((id(illuminance_sensor).state / 100.0) + 0.1);
                red: 1
                green: 0
                blue: 0
      - if:
          condition:
            - lambda: return id(iaqstatic).state >= 200 && id(iaqstatic).state < 300;
          then:
            - light.turn_on:
                id: ws2812_7led
                effect: 5 LED Dial
            - light.turn_off:
                id: ws2812_7led7
            - light.turn_on:
                id: ws2812_7led7
                effect: Slow Pulse 40%
                brightness: !lambda |-
                  return ((id(illuminance_sensor).state / 100.0) + 0.1);
                red: 0.5
                green: 0
                blue: 0.5
      - if:
          condition:
            - lambda: return id(iaqstatic).state >= 300;
          then:
            - light.turn_on:
                id: ws2812_7led
                effect: 5 LED Dial
            - light.turn_off:
                id: ws2812_7led7
            - light.turn_on:
                id: ws2812_7led7
                effect: Slow Pulse 40%
                brightness: !lambda |-
                  return ((id(illuminance_sensor).state / 100.0) + 0.1);
                red: 0.502
                green: 0
                blue: 0

  - id: take_battery_measurement
    mode: restart
    then:
      - switch.turn_on: batt_divider_switch
      - delay: 500ms
      - component.update: raw_adc_voltage
      - component.update: battery_voltage
      - switch.turn_off: batt_divider_switch
      - logger.log: "Successful battery measurment."
