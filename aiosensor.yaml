sensor:
  - platform: wifi_signal
    name: "Wifi Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: debug
    cpu_frequency:
      icon: mdi:cpu-32-bit
      id: cpu_speed
      name: "CPU Frequency"
      filters:
        - lambda: return x / 1000000;
      unit_of_measurement: "MHz"
      entity_category: "diagnostic"
  - platform: internal_temperature
    name: "CPU Temperature"
  - platform: template
    id: esp_memory
    icon: mdi:memory
    name: "ESP Free Memory"
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024;
    unit_of_measurement: 'kB'
    state_class: measurement
    entity_category: "diagnostic"
    update_interval: 60s
  - platform: uptime
    name: "ESP Uptime"
    id: sys_uptime
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: bh1750
    id: illuminance_sensor
    name: "Illuminance"
    address: 0x23
    update_interval: "${bh1750_update_interval}"
    filters:
      - offset: ${illuminance_offset}
      - lambda: "return x + id(illuminance_offset_ui).state;"
  - platform: bme68x_bsec2
    temperature:
      name: "BME680 Internal Temperature"
      id: bme_raw_temp
      accuracy_decimals: 2
    pressure:
      name: "Pressure"
      device_class: atmospheric_pressure
      filters:
        - offset: ${pressure_offset}
        - lambda: "return x + id(pressure_offset_ui).state;"
    humidity:
      name: "BME680 Internal Humidity"
      id: bme_raw_humidity
      accuracy_decimals: 2
    gas_resistance:
      name: "Gas Resistance"
      id: gasresistance
      filters:
        - median
#    iaq:
#      name: "IAQ"
#      id: iaq
#      device_class: aqi
#      filters:
#        - offset: ${iaq_offset}
#        - lambda: "return x + id(iaq_offset_ui).state;"
    iaq_static:
      name: "IAQ Static"
      id: iaqstatic
      device_class: aqi
      filters:
        - offset: ${iaq_offset}
        - lambda: "return x + id(iaq_offset_ui).state;"
    iaq_accuracy:
      name: "IAQ Accuracy"
      id: iaqaccuracy
    co2_equivalent:
      name: "CO2 Equivalent"
      device_class: carbon_dioxide
      filters:
        - offset: ${co2_offset}
        - lambda: "return x + id(co2_offset_ui).state;"
    breath_voc_equivalent:
      name: "Breath VOC Equivalent"
      device_class: volatile_organic_compounds_parts
      filters:
        - offset: ${voc_offset}
        - lambda: "return x + id(voc_offset_ui).state;"
  - platform: template
    name: "Temperature"
    id: real_room_temp
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 2
    lambda: |-
      return id(bme_raw_temp).state + id(temperature_offset_ui).state;
  - platform: template
    name: "Humidity"
    id: real_room_humidity
    unit_of_measurement: "%"
    device_class: "humidity"
    state_class: "measurement"
    accuracy_decimals: 2
    lambda: |-
      return id(bme_raw_humidity).state + id(humidity_offset_ui).state;
  - platform: homeassistant
    id: ha_reference_temp
    entity_id: "sensor.ble_temperature_hall_mi_temp_and_rh"
    internal: true 
  - platform: homeassistant
    id: ha_reference_hum
    entity_id: "sensor.ble_humidity_hall_mi_temp_and_rh"
    internal: true
  - platform: ld2410
    light:
      name: light
    moving_distance:
      name: "mmWave Moving Distance"
      #filters: 
      #  - throttle: $ld2410_throttle
    still_distance:
      name: "mmWave Still Distance"
      #filters: 
      #  - throttle: $ld2410_throttle
    moving_energy:
      name: "mmWave Move Energy"
      #filters: 
      #  - throttle: $ld2410_throttle
    still_energy:
      name: "mmWave Still Energy"
      #filters: 
      #  - throttle: $ld2410_throttle
    detection_distance:
      name: "mmWave Detection Distance"
    g0:
      move_energy:
        name: "mmWave g0 move energy"
      still_energy:
        name: "mmWave g0 still energy"
    g1:
      move_energy:
        name: "mmWave g1 move energy"
      still_energy:
        name: "mmWave g1 still energy"
    g2:
      move_energy:
        name: "mmWave g2 move energy"
