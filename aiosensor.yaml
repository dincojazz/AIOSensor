bme68x_bsec2_i2c:
  address: "${bme_address}"
  model: bme680
  operating_age: 28d
  sample_rate: LP
  supply_voltage: 3.3V
  temperature_offset: "${temperature_offset}"

ld2410:

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"
    entity_category: diagnostic
  - platform: safe_mode
    name: "Restart (Safe Mode)"
    entity_category: diagnostic
  - platform: ld2410
    factory_reset:
      name: "mmWave Factory Reset"
    restart:
      name: "mmWave Restart"
    query_params:
      name: "mmWave Force Refresh"
  - platform: template
    name: "Script stop"
    id: aqi_led_control_script_stop
    on_press: 
      then:
        - script.stop: AQI_LED_control
        - light.turn_off: ws2812_7led
        - light.turn_off: ws2812_7led7
  - platform: template
    name: "Script start"
    id: aqi_led_control_script_start
    on_press: 
      then:
        - script.execute: AQI_LED_control
  - platform: template
    name: "Update Battery Now"
    id: update_battery_btn
    icon: "mdi:gesture-tap-button"
    on_press:
      then:
        - script.execute: take_battery_measurement
  - platform: factory_reset
    name: "Reset BSEC State"
    id: reset_bsec_state
  - platform: template
    name: "Auto Calibrate from HA"
    icon: "mdi:calculator"
    entity_category: config
    on_press:
      then:
        - lambda: |-
            if (!std::isnan(id(bme_raw_temp).state) && !std::isnan(id(ha_reference_temp).state)) {
              float calculated_temp_offset = id(ha_reference_temp).state - id(bme_raw_temp).state;
              id(saved_temp_offset) = calculated_temp_offset;
              id(temperature_offset_ui).publish_state(calculated_temp_offset);
              ESP_LOGI("main", "Auto-calibrated Temp Offset saved to Globals: %f", calculated_temp_offset);
            } else {
              ESP_LOGW("main", "Cannot calibrate temperature: missing readings!");
            }
            if (!std::isnan(id(bme_raw_humidity).state) && !std::isnan(id(ha_reference_hum).state)) {
              float calculated_hum_offset = id(ha_reference_hum).state - id(bme_raw_humidity).state;
              id(saved_hum_offset) = calculated_hum_offset;
              id(humidity_offset_ui).publish_state(calculated_hum_offset);
              ESP_LOGI("main", "Auto-calibrated Hum Offset saved to Globals: %f", calculated_hum_offset);
            } else {
              ESP_LOGW("main", "Cannot calibrate humidity: missing readings!");
            }
            global_preferences->sync();
switch:
  - platform: ld2410
    engineering_mode:
      name: "mmWave Engineering Mode"
    bluetooth:
      name: "mmWave Bluetooth"
  - platform: template
    id: switch_ble_gateway_discovery
    name: "BLE Gateway Discovery"
    icon: mdi:bluetooth-connect
    lambda: return id(${blegatewayname}_blegateway).get_discovery();
    turn_on_action:
      lambda: 
        id(${blegatewayname}_blegateway).set_discovery(true);
    turn_off_action:
      lambda: 
        id(${blegatewayname}_blegateway).set_discovery(false);
    disabled_by_default: false
    entity_category: config
  - platform: gpio
    name: "Battery divider switch"
    pin: "${bss138_pin}"
    id: batt_divider_switch
    restore_mode: ALWAYS_OFF
    internal: false
  - platform: factory_reset
    name: "ESP Factory Reset"
    disabled_by_default: True
    icon: mdi:heart-broken
