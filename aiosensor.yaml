text_sensor:
  - platform: ble_scanner
    name: "BLE Devices Scanner"
  - platform: bme68x_bsec2
    iaq_accuracy:
      name: "IAQ Accuracy"
      icon: mdi:checkbox-marked-circle-outline
      id: iaq_accuracy
  - platform: template
    name: "IAQ Classification"
    icon: "mdi:checkbox-marked-circle-outline"
    lambda: |-
      if (std::isnan(id(iaqaccuracy).state) || std::isnan(id(iaqstatic).state)) {
        return {"Stabilizing"};
      }
      if (id(iaqaccuracy).state == 0) {
        return {"Stabilizing"};
      }
      if ( int(id(iaqstatic).state) <= 50) {
        return {"Excellent"};
      }
      else if (int(id(iaqstatic).state) >= 50 && int(id(iaqstatic).state) <= 100) {
        return {"Good"};
      }
      else if (int(id(iaqstatic).state) >= 100 && int(id(iaqstatic).state) <= 150) {
        return {"Lightly polluted"};
      }
      else if (int(id(iaqstatic).state) >= 150 && int(id(iaqstatic).state) <= 200) {
        return {"Moderately polluted"};
      }
      else if (int(id(iaqstatic).state) >= 200 && int(id(iaqstatic).state) <= 250) {
        return {"Heavily polluted"};
      }
      else if (int(id(iaqstatic).state) >= 250 && int(id(iaqstatic).state) <= 350) {
        return {"Severely polluted"};
      }
      else if (int(id(iaqstatic).state) >= 350) {
        return {"Extremely polluted"};
      }
      else {
        return {"error"};
      }
  - platform: ld2410
    version:
      name: "mmWave Firmware Version"
    mac_address:
      name: "mmWave Mac Address"
  - platform: homeassistant
    id: ble_gateway_devices
    entity_id: binary_sensor.ble_gateway
    attribute: devices
    on_value:
      then:
        lambda: id(${blegatewayname}_blegateway).set_devices(x);
