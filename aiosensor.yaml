substitutions:
  name: "aiosensor"  # lowercase only, have to be unique
  friendly_name: "AIOSensor"  # device name and entity prefix
  blegatewayname: "aiosensor"
  version: "1.3.0"
  rgb_led_pin: GPIO3
  uart_rx_pin: GPIO20
  uart_tx_pin: GPIO21
  batt_volt_pin: GPIO1
  bss138_pin: GPIO2 # Gate of BSS138
  voltage_multiplier: "2.0" # Correct if needed
  battery_update_interval: "60s"
  bh1750_update_interval: "5s"
  ld2410_throttle: 2000ms
  illuminance_offset: "0"
  bme_address: "0x77"  # for some modules you have to change it to 0x77
  bme_update_interval: 60s
  co2_offset: "0"  # bsec only
  humidity_offset: "0.0"
  iaq_offset: "0" # bsec only
  pressure_offset: "0"
  temperature_offset: "0.0"
  voc_offset: "0" # bsec only

esphome:
  name: "${name}"
  comment: BLEProxy LD2410b BH1750 BME680
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: False
  project:
    name: "dincojazz.AIOsensor"
    version: "${version}"
  platformio_options:
    board_build.extra_flags:
      - "-DARDUINO_USB_CDC_ON_BOOT=0"
    board_build.flash_mode: dio
  min_version: 2023.10.0
  compile_process_limit: 1
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(temperature_offset_ui).publish_state(id(saved_temp_offset));
          id(humidity_offset_ui).publish_state(id(saved_hum_offset));

dashboard_import:
  package_import_url: github://dincojazz/AIOSensor/aiosensor.yaml@main
  import_full_config: true

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  cpu_frequency: 80MHZ
  toolchain: platformio
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: my_custom_components

globals:
  - id: last_update_ld2450
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: init_zone_publish
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_illuminance
    type: float
    restore_value: no
    initial_value: "-1"
  - id: saved_temp_offset
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: saved_hum_offset
    type: float
    restore_value: yes
    initial_value: '0.0'

# Enable Home Assistant API
api:
  encryption:
    key: !secret aiosensor_api_key

ota:
  - platform: esphome
    password: !secret aiosensor_ota_pass

safe_mode:
  disabled: false

logger:
#  baud_rate: 0  # disable logging via UART

debug:
  update_interval: 30s

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  id: bus_a

uart:
  tx_pin: "${uart_tx_pin}"
  rx_pin: "${uart_rx_pin}"
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
  data_bits: 8

time:
  - platform: homeassistant
    id: time_ha

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  power_save_mode: HIGH #LIGHT
  # Fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: !secret web_server_password
  output_power: 12.5dBm

captive_portal:

#web_server:
#  port: 80
#  auth:
#    username: !secret web_server_user
#    password: !secret web_server_password

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

#esp32_improv:
#  authorizer: none

ble_gateway:
  id: ${blegatewayname}_blegateway
  devices:
    - mac_address: !secret mi_scale_v2_mac
  on_ble_advertise:
    then:
      homeassistant.event:
        event: esphome.on_ble_advertise
        data:
          packet: !lambda return packet;
          gateway_id: "$(ble_gateway_id)"

